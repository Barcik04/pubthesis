spring.application.name=services_management_system
spring.datasource.url=jdbc:postgresql://localhost:5399/services_management_db
spring.datasource.username=igor
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# JWT
spring.app.jwtSecret=VGhpc0lzQVNlY3JldEtleU5lZWRzQXQhTGVhc3QzMkJ5dGVzIQ==
spring.app.jwtExpirationMs=3000000



# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.enable.http=true




spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.frontend-url=http://localhost:5173



# STRIPE
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}



# Nominatim
nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.user-agent=services-management-system/1.0 (contact: bartosz.browski@gmail.com)


