services:
  db:
    container_name: services_management_db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5399:5432"
    networks:
      - db
    restart: unless-stopped

  app:
    container_name: services_management_app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_FLYWAY_USER: ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - db
    restart: unless-stopped

  stripe-cli:
    container_name: services_management_stripe_cli
    image: stripe/stripe-cli:latest
    depends_on:
      - app
    command: listen --events payment_intent.succeeded --forward-to http://app:8080/payments/webhook
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    networks:
      - db
    restart: unless-stopped

volumes:
  db:

networks:
  db:
    driver: bridge